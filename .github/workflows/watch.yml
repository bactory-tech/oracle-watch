name: watch

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      - name: Commit report
        run: |
          git config user.name 'oracle-watch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data
          git diff --cached --quiet || git commit -m "report: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
